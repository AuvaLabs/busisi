name: Senate budget catalogue monitor

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senate-budget-catalogue-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Check the FY2027 Senate catalogue
        run: PYTHONPATH=. python3 ops/harness/budget_watchdog_senate_monitor.py

      - name: Preserve the monitor evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: senate-budget-catalogue-${{ github.run_id }}
          path: data/budget_watchdog/senate-monitor/
          if-no-files-found: error
          retention-days: 30
