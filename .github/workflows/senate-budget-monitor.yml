name: Senate budget catalogue monitor

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senate-budget-catalogue-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Restore source health history
        uses: actions/cache/restore@v6
        with:
          path: data/budget_watchdog/senate-monitor/state.json
          key: senate-source-health-${{ github.run_id }}
          restore-keys: |
            senate-source-health-

      - name: Check the FY2027 Senate catalogue on schedule
        if: github.event_name == 'schedule'
        run: PYTHONPATH=. python3 ops/harness/budget_watchdog_senate_monitor.py --strict --respect-backoff

      - name: Check the FY2027 Senate catalogue on demand
        if: github.event_name == 'workflow_dispatch'
        run: PYTHONPATH=. python3 ops/harness/budget_watchdog_senate_monitor.py --strict

      - name: Summarize the catalogue check
        if: always()
        shell: bash
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from ops.harness.budget_watchdog_senate_monitor import format_summary

          path = Path("data/budget_watchdog/senate-monitor/report.json")
          summary_text = "## FY2027 Senate catalogue check\n\nThe monitor did not produce a report.\n"
          if path.is_file():
              summary_text = format_summary(json.loads(path.read_text(encoding="utf-8")))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(summary_text)
          PY

      - name: Save source health history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/budget_watchdog/senate-monitor/state.json
          key: senate-source-health-${{ github.run_id }}

      - name: Preserve the monitor evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: senate-budget-catalogue-${{ github.run_id }}
          path: data/budget_watchdog/senate-monitor/
          if-no-files-found: error
          retention-days: 30
