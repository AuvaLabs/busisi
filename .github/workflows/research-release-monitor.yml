name: Research release monitor

on:
  schedule:
    - cron: '19 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Verify immutable research packages and publication gates
        run: PYTHONPATH=. python3 ops/harness/budget_watchdog_research_editor.py
