name: Busisi production monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: busisi-production-monitor
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/busisi/package-lock.json

      - name: Install verifier dependencies
        working-directory: cloudflare/busisi
        run: npm ci

      - name: Verify the production contract
        working-directory: cloudflare/busisi
        run: npm run verify:live
