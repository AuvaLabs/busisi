name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: PYTHONPATH=. pytest engine/tests/budget_watchdog/ -q --no-header --cov --cov-report=term-missing

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/busisi/package-lock.json

      - name: Install Busisi Worker dependencies
        working-directory: cloudflare/busisi
        run: npm ci

      - name: Verify Busisi data and Worker bundles
        working-directory: cloudflare/busisi
        run: npm run check
