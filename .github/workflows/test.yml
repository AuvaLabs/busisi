name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate contributor attribution
        shell: bash
        run: |
          identity_pattern='claude|codex|chatgpt|openai|anthropic|copilot'
          if git log --format='%an <%ae>' | grep -Eiq "$identity_pattern"; then
            echo "Contributor history contains a prohibited automated identity."
            exit 1
          fi
          if git log --format='%B' | grep -Eiq "^co-authored-by:.*($identity_pattern)"; then
            echo "Commit history contains a prohibited automated co-author trailer."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: PYTHONPATH=. pytest engine/tests/budget_watchdog/ -q --no-header --cov --cov-report=term-missing

      - name: Run static checks
        run: |
          ruff check engine/budget_watchdog engine/tests/budget_watchdog ops/harness
          mypy engine/budget_watchdog

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/busisi/package-lock.json

      - name: Install Busisi Worker dependencies
        working-directory: cloudflare/busisi
        run: npm ci

      - name: Verify Busisi data and Worker bundles
        working-directory: cloudflare/busisi
        run: npm run check
