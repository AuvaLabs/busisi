name: Source drift monitor

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit dependencies
        run: pip install -r requirements.txt
      - name: Restore facility source health history
        uses: actions/cache/restore@v4
        with:
          path: data/budget_watchdog/facility-source-monitor/latest.json
          key: facility-source-health-${{ github.run_id }}
          restore-keys: |
            facility-source-health-
      - name: Check monitored source revisions and catalogues
        run: PYTHONPATH=. python3 ops/harness/budget_watchdog_source_monitor.py --reset-output
      - name: Check DepEd facility registry availability
        if: always()
        run: PYTHONPATH=. python3 ops/harness/budget_watchdog_facility_monitor.py --reset-output
      - name: Check official contractor accountability sources
        if: always()
        run: PYTHONPATH=. python3 ops/harness/budget_watchdog_accountability.py --source-only --reset-output
      - name: Save facility source health history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/budget_watchdog/facility-source-monitor/latest.json
          key: facility-source-health-${{ github.run_id }}
      - name: Retain source evidence and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-drift-${{ github.run_id }}
          path: |
            data/budget_watchdog/source-monitor/
            data/budget_watchdog/facility-source-monitor/
            data/budget_watchdog/contractor-accountability/
          if-no-files-found: error
          retention-days: 30
