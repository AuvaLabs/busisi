# Grimoire shared infrastructure: Postgres + Redis on a private bridge.
# Application services (per-vertical renderers, pipelines) join this network
# without publishing ports — only Caddy (on the host) hits them at 127.0.0.1.

name: grimoire

networks:
  grimoire_internal:
    driver: bridge
    name: grimoire_internal

services:
  postgres:
    image: postgres:16-alpine
    container_name: grimoire-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [grimoire_internal]
    # Bound to loopback only — never reachable from public internet.
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: grimoire-redis
    restart: unless-stopped
    # 512MB cap, allkeys-lru eviction, AOF every second.
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - ./data/redis:/data
    networks: [grimoire_internal]
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "0.5"
    mem_limit: 640m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
