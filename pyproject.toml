[project]
name = "busisi-budget-watchdog"
version = "1.0.0"
description = "Evidence-first Philippine public budget explorer"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine.budget_watchdog*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["engine/budget_watchdog", "engine/tests/budget_watchdog", "ops/harness"]
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "S", "RET", "PT", "PL"]
ignore = ["E501", "S101", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"engine/tests/**" = ["S101", "S105", "S106", "PLR2004"]
"engine/tests/budget_watchdog/test_safe_http.py" = ["S104"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unreachable = true
files = ["engine/budget_watchdog"]
exclude = ["engine/tests/", "data/"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["engine/tests/budget_watchdog"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--tb=short"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["engine/budget_watchdog"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
