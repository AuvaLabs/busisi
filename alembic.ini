# Alembic configuration for grimoire.
#
# Run from the repo root (or /srv/grimoire on the server) with the project
# venv active and DATABASE_URL exported (env.py reads it at runtime, so the
# password is never committed):
#
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe change"
#   alembic stamp head      # for an existing prod DB on a fresh checkout

[alembic]
script_location = ops/migrations

# Format for new revision filenames: 0001_baseline.py, 0002_my_change.py …
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
timezone = UTC

# Read DATABASE_URL from the environment in env.py, not here.
sqlalchemy.url =


[post_write_hooks]
# Optional: format new migrations through ruff.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
