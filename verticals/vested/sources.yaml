# Vested — personal finance for tech workers.
#
# Schema: see engine/core/feed_loader.py and verticals/_template/README.md.
# Each entry now carries a per-source `agency_class` (A-F) consumed by the
# editorial curator and the multi-source rewriter.
#
# Agency classes (R1, 2026-05-06):
#   A  Wire / news agency        Reuters, AP, AFP, Bloomberg, Dow Jones
#   B  Newspaper of record       FT, WSJ, NYT, BBC, Guardian, Economist
#   C  Trade press               Levels.fyi, NerdWallet, MarketWatch
#   D  Primary / official        Brokerages, regulators (IRS/Fed/SEC/CFPB)
#   E  Research aggregator       (rare for PF; SSRN-style if added)
#   F  Analysis / commentary     PF blogs, FIRE community creators
#
# Class G (Reddit / forums) is REMOVED at the source list — community signals
# are excluded from the rewriter pipeline. See docs/REWRITER_BUILD_LOG.md.

