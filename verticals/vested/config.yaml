# Vested — vertical config.
# Read by engine.core.classifier, deduplicator, pipeline, output_renderer.

name: vested
display_name: Vested
description: Personal finance for software engineers, data scientists, and AI researchers earning $100K-$500K.
operating_entity: Auva Labs FZE

# ---- Theming ----
accent_light: "#2D5F5D"
accent_dark: "#5A8E8C"

# ---- Taxonomy (15 topics per BUILD-DIRECTIVE Phase 5) ----
topics:
  equity-compensation:
    - \bRSU[s]?\b
    - \bISO[s]?\b
    - \bNSO[s]?\b
    - \bESPP\b
    - \bvest(ing|ed|s)?\b
    - \boption[s]? grant\b
    - \bequity (grant|comp(ensation)?)\b
    - \brefresh(er|ed)?\b

  taxes:
    - \bIRS\b
    - \btax-?(loss harvest|return|bracket|filing)\b
    - \bAMT\b
    - \bQSBS\b
    - \b1099\b
    - \bW-?2\b
    - \b401\(k\)\b
    - \bRoth\b
    - \bmega backdoor\b
    - \bpre-?tax\b
    - \bafter-?tax\b
    - \bSection \d+\b
    - \bdeduction\b

  retirement-planning:
    - \bretirement\b
    - \b401\(k\)\b
    - \bIRA\b
    - \bRoth\b
    - \bHSA\b
    - \bFSA\b
    - \bpension\b

  brokerage-investing:
    # "Public" (the broker) dropped — matched the ordinary word "public".
    - \b(Fidelity|Schwab|Vanguard|Robinhood)\b
    - \bETF[s]?\b
    - \bindex fund[s]?\b
    - \bbroker(age)?\b
    - \bportfolio\b
    - \basset allocation\b
    - \brebalanc(e|ing)\b

  real-estate:
    - \bmortgage\b
    - \bhome (purchase|loan|equity)\b
    - \bREIT[s]?\b
    - \brental property\b
    - \b1031 exchange\b

  debt-management:
    - \bstudent loan[s]?\b
    - \bcredit card debt\b
    - \brefinanc(e|ing)\b
    - \bdebt (snowball|avalanche|payoff)\b

  salary-negotiation:
    - \bnegotiat(e|ing|ion)\b
    - \boffer letter\b
    - \blevels\.fyi\b
    - \b(comp|compensation|pay|job) band[s]?\b
    - \btotal compensation\b
    - \bbase salary\b
    - \bsign-on bonus\b

  layoff-strategy:
    - \blayoff[s]?\b
    - \bRIF\b
    - \bseverance\b
    - \bunemployment insurance\b
    - \bCOBRA\b

  financial-independence:
    - \bFIRE\b
    - \bfinancial independence\b
    - \bsafe withdrawal rate\b
    - \b4% rule\b
    - \bcoast(FIRE| fi)\b

  side-income:
    - \bside hustle\b
    - \bfreelanc(e|ing)\b
    - \b1099 income\b
    - \bSchedule C\b

  banking:
    - \bhigh-?yield savings\b
    - \bHYSA\b
    - \bCD ladder\b
    - \bI-?bond[s]?\b
    - \bT-?bill[s]?\b
    - \bTreasur(y|ies)\b
    - \bSoFi\b
    - \bMercury (bank|banking)\b

  credit:
    # NB: bare \bpoints\b / \bmiles\b / \bChase\b matched common words ("points
    # to", "miles away", "chase down"). Require finance context. (2026-06-06)
    - \bcredit score\b
    - \bFICO\b
    - \bcredit card\b
    - \b(Amex|American Express|Capital One)\b
    - \bChase (Sapphire|Freedom|Ink|United|Marriott)\b
    - \btransfer (bonus|partner)\b
    - \b(reward|credit[- ]card|membership|transferable) points\b
    - \bpoints and miles\b
    - \b(airline|reward|frequent[- ]?flyer|award) miles\b

  insurance-life-stage:
    - \bterm life\b
    - \bdisabilit(y|ies) insurance\b
    - \bumbrella policy\b
    - \brenters insurance\b
    - \bhealth insurance\b

  charitable-giving:
    - \bDAF\b
    - \bdonor-advised fund\b
    - \bcharitable (deduction|giving)\b
    - \bappreciated stock\b

  estate-planning:
    # NB: bare \bwill\b / \btrust\b matched the ordinary verb/noun ("prices will
    # rise", "trust the data") and mislabelled general news. Require finance
    # context. (2026-06-06)
    - \b(last will|living will|will and testament|leave[s]? (a|their) will)\b
    - \b(living|revocable|irrevocable|family|testamentary) trust\b
    - \btrust fund\b
    - \bestate (tax|plan(ning)?)\b
    - \bbeneficiar(y|ies)\b
    - \bpower of attorney\b
    - \bprobate\b
    - \binheritance\b

# ---- Entity types ----
entity_types:
  - brokerage
  - bank
  - credit-card
  - tax-software
  - insurance-provider
  - employer

# ---- Dedup guards (non_dedup_keys) ----
non_dedup_keys:
  - "\\b([A-Z]{2,5})\\b"
  - "Pub\\.?\\s*(\\d+)"
  - "401\\(k\\)|403\\(b\\)|457\\(b\\)"
  - "Section\\s+(\\d+)"

# ---- Always-escalate topics ----
always_escalate:
  - taxes
  - retirement-planning
  - estate-planning

# ---- Per-run LLM escalation budget ----
escalation_budget: 25

# ---- Researcher (Exa) — finance + fiscal-research source bias ----
# Read by engine/core/researcher._load_research_opts. Biases Exa neural search
# toward authoritative finance press, primary agencies, AND fiscal-policy
# research orgs (Peterson Foundation et al.) so per-article bundles carry
# real, sourced research — not arXiv/Wikipedia. Per-vertical; Embedding keeps
# its AI/ML defaults (no block).
research:
  # No category: a "news" category would drop research reports (pgpf/CBO/
  # Brookings publish reports, not news). Omitting it lets the include_domains
  # allowlist return BOTH news AND research papers from authoritative sources.
  include_domains:
    # fiscal-policy / economic research orgs (the pgpf.org family)
    - pgpf.org
    - taxpolicycenter.org
    - crfb.org
    - brookings.edu
    - urban.org
    - cbpp.org
    - pewresearch.org
    - ici.org
    - bipartisanpolicy.org
    - epi.org
    # primary data agencies
    - bls.gov
    - bea.gov
    - federalreserve.gov
    - irs.gov
    - cbo.gov
    - treasury.gov
    - treasurydirect.gov
    - ssa.gov
    - consumerfinance.gov
    # authoritative finance press / consumer-finance
    - reuters.com
    - bloomberg.com
    - wsj.com
    - ft.com
    - morningstar.com
    - kiplinger.com
    - nerdwallet.com

# ---- Curator (editorial gate) ----
# require_topic_relevance: when true, the curator multiplies an article's
# quality score by a topic-relevance factor derived from the classifier's
# taxonomy labels. Articles with no personal-finance label (off-topic lifestyle
# / general-news pieces that slip in via broad feeds) are knocked into the
# "skip" tier so the front page stays on personal finance. See engine/core/
# curator.py `score_topic_relevance`.
curator:
  require_topic_relevance: true

# ---- Pipeline tuning ----
fuzzy_dedup_threshold: 0.70
news_cutoff_days: 14
reference_cutoff_days: null
