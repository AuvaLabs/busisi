# Modelwatch — AI/ML knowledge platform sources.
#
# Schema: see engine/core/feed_loader.py and verticals/_template/README.md.
# 50 feeds across 7 priority bands. Reviewed quarterly; broken sources are
# auto-disabled by source_health when consecutive failures > 5.
#
# Priority bands (per BUILD-DIRECTIVE Phase 3):
#   1.00  AI labs (first-party announcements)
#   0.90  Research aggregators (ArXiv, Papers with Code)
#   0.85  AI newsletters / regulatory bodies
#   0.80  Tech press (AI sections only)
#   0.70  Independent voices
#   0.60  Community signals (subreddit hot, HN ML > score 100)

