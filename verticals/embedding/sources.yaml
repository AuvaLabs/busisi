# The Embedding Report — AI/ML knowledge platform sources.
#
# Schema: see engine/core/feed_loader.py and verticals/_template/README.md.
# Each entry now carries a per-source `agency_class` (A-F) consumed by the
# editorial curator and the multi-source rewriter.
#
# Agency classes (R1, 2026-05-06):
#   A  Wire / news agency        Reuters, AP, AFP, Bloomberg, Dow Jones
#   B  Newspaper of record       FT, WSJ, NYT, BBC, Guardian, Economist
#   C  Trade press               TechCrunch, Verge, IEEE Spectrum, MIT TR
#   D  Primary / official        Lab blogs, regulators, think-tank releases
#   E  Research aggregator       ArXiv, PapersWithCode, HF daily papers
#   F  Analysis / commentary     Substacks, analyst blogs, individual voices
#
# Class G (Reddit / HN / forums) is REMOVED at the source list — community
# signals are excluded from the rewriter pipeline. See docs/REWRITER_BUILD_LOG.md.
#
# `priority_weight` is the SCHEDULER signal (refresh ordering). `agency_class`
# is the EDITORIAL signal (curator authority + rewriter primary-citation
# eligibility). Both coexist — they answer different questions.

# ====== Class A — Wire / news agency ======

# Reuters discontinued public RSS for most coverage in 2024. Operator
# evaluation candidates (verify each before enabling — Reuters has been
# inconsistent about RSS availability):
#   - https://www.reuters.com/arc/outboundfeeds/v3/category/technology/?outputType=xml
#   - https://www.reuters.com/pf/api/v3/content/fetch/articles-by-section?query=...
# AP RSS — limited but partial:
#   - https://apnews.com/hub/artificial-intelligence/feed (was 404 in mid-2024;
#     re-check periodically)
# AFP, Dow Jones — paid syndication only; not RSS-accessible.
# Bloomberg — see Class A entry under Vested for the wealth podcast feed; no
# AI-section RSS as of 2026-05-07.

